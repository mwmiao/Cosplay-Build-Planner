# Cosplay Build Planner — UGREEN NAS (UGOS Pro Docker app) / any Docker host.
#
# Uses the image GitHub Actions publishes to Docker Hub on every push to main,
# so the NAS never builds anything and UGOS's Docker app can offer updates.
# Pin a release instead of following main with e.g. eazyeight/cosplay-build-planner:1.1
#
# Set APP_URL (the address you open the app at) in a .env file next to this
# one (see .env.example). The app is meant for your home network and
# Tailscale only. Do NOT forward port 1337 on your router.
#
# 1. Create a `data` folder next to this file.
# 2. Create a Project from this file in the Docker app (or: docker compose up -d).
# 3. Open http://<nas-lan-ip>:1337, or http://<nas-tailscale-name>:1337 via Tailscale.
#
# Optional overrides go in a .env file next to this one (see .env.example).

services:
  cosplay-planner:
    image: eazyeight/cosplay-build-planner:latest
    container_name: cosplay-planner
    restart: unless-stopped
    environment:
      PORT: "1337"
      DATABASE_URL: file:/app/data/cosplay.db
      UPLOAD_DIR: /app/data/uploads
      TZ: ${TZ:-Europe/London}
      # Starting default currency; can be changed any time in Settings
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      # Your NAS user's IDs (SSH in and run `id`); files in the data folder get this owner.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Accounts (see README → Accounts). The session-signing secret is created once
      # in the data folder (data/secrets/auth-secret) unless AUTH_SECRET is set.
      APP_URL: ${APP_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Optional email for password-reset links; without it, use the reset-password command.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Instagram monitor (Events): reads public accounts through the rss-bridge
      # service below. See README → Events → Instagram monitor.
      RSS_BRIDGE_BASE_URL: ${RSS_BRIDGE_BASE_URL:-http://rss-bridge:80}
      INSTAGRAM_POLL_INTERVAL_MINUTES: ${INSTAGRAM_POLL_INTERVAL_MINUTES:-30}
      INSTAGRAM_MONITOR_ENABLED: ${INSTAGRAM_MONITOR_ENABLED:-true}
    ports:
      - "1337:1337"
    volumes:
      # Everything the app stores: cosplay.db, uploads/, backups/.
      # Relative to this file's folder, so it works on any volume.
      - ${DATA_PATH:-./data}:/app/data
    depends_on:
      - rss-bridge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted RSS-Bridge (https://github.com/RSS-Bridge/rss-bridge): turns public
  # Instagram accounts into feeds for the Events monitor. Internal only: no host
  # port, so only the app (http://rss-bridge:80) can reach it. To open its web UI
  # for debugging, add docker-compose.rss-bridge-debug.yml (see README).
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: cosplay-rss-bridge
    restart: unless-stopped
    environment:
      # Only the Instagram bridge is enabled.
      RSSBRIDGE_system_enabled_bridges: Instagram
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
