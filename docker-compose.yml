# Cosplay Build Planner — UGREEN NAS (UGOS Pro Docker app) / any Docker host.
#
# Uses the image GitHub Actions publishes on every push to main, so the NAS
# never builds anything. UGOS's Docker app shows when a newer :latest exists.
#
# Works as-is: no .env file needed. Login is off; the app is meant for your
# home network and Tailscale only. Do NOT forward port 1337 on your router.
#
# 1. Create a `data` folder next to this file.
# 2. Create a Project from this file in the Docker app (or: docker compose up -d).
# 3. Open http://<nas-lan-ip>:1337, or http://<nas-tailscale-name>:1337 via Tailscale.
#
# Optional overrides go in a .env file next to this one (see .env.example).

services:
  cosplay-planner:
    image: ghcr.io/mwmiao/cosplay-build-planner:latest
    container_name: cosplay-planner
    restart: unless-stopped
    environment:
      PORT: "1337"
      DATABASE_URL: file:/app/data/cosplay.db
      UPLOAD_DIR: /app/data/uploads
      TZ: ${TZ:-Europe/London}
      # Starting default currency; can be changed any time in Settings
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      # Your NAS user's IDs (SSH in and run `id`); files in the data folder get this owner.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      SEED_EXAMPLE: ${SEED_EXAMPLE:-true}
      # Optional login: set both in .env to require a password.
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "1337:1337"
    volumes:
      # Everything the app stores: cosplay.db, uploads/, backups/.
      # Relative to this file's folder, so it works on any volume.
      - ${DATA_PATH:-./data}:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
