# Tests every push/PR. On main and on version tags (v1.2.3) it publishes the
# Docker image:
#   - ghcr.io/mwmiao/cosplay-build-planner          (always)
#   - docker.io/eazyeight/cosplay-build-planner      (when the DOCKERHUB_TOKEN
#     repository secret is set)
# Tags: latest (main), sha-<commit>, and 1.2.3 + 1.2 for version tags.
# Version tags also create a GitHub Release with that version's CHANGELOG notes.
name: Test and publish image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: cosplay-build-planner
  # Docker Hub account the image is published under (not secret).
  DOCKERHUB_USER: eazyeight

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no system packages for Ubuntu 26 (ubuntu-latest from Oct 2026)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Real-container test: upgrade from the published 1.2.1 image (no accounts)
  # to this build on the same data volume, claim the old project, check the
  # stored FX conversion is unchanged, then replace the container and check
  # the session, data and images survive. Nothing is published if it fails.
  container:
    needs: test
    runs-on: ubuntu-24.04 # see the test job
    timeout-minutes: 30
    env:
      DATA: ${{ github.workspace }}/ci-data
      STATE_DIR: ${{ github.workspace }}/container-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - name: Build this version (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cosplay-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Helper scripts
        run: |
          cat > "$RUNNER_TEMP/wait.sh" <<'EOS'
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1337/api/health >/dev/null 2>&1; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1
          EOS
          chmod +x "$RUNNER_TEMP/wait.sh"
          mkdir -p "$DATA"
      - name: Start 1.2.1 (before accounts)
        run: |
          docker run -d --name app -p 1337:1337 -v "$DATA:/app/data" -e PUID=$(id -u) -e PGID=$(id -g) eazyeight/cosplay-build-planner:1.2.1
          "$RUNNER_TEMP/wait.sh"
      - run: npx playwright test -c playwright.container.config.ts
        env: { CONTAINER_PHASE: legacy }
      - name: Replace with this build (same volume)
        run: |
          docker rm -f app
          docker run -d --name app -p 1337:1337 -v "$DATA:/app/data" -e PUID=$(id -u) -e PGID=$(id -g) -e APP_URL=http://127.0.0.1:1337 -e EVENT_SYNC_HOURS=0 -e INSTAGRAM_MONITOR_ENABLED=false cosplay-planner:ci
          "$RUNNER_TEMP/wait.sh"
      - run: npx playwright test -c playwright.container.config.ts
        env: { CONTAINER_PHASE: register }
      - name: Claim old projects (dry run, then for real)
        run: |
          docker exec app node scripts/claim-projects.js --email ci-owner@example.test --dry-run
          docker exec app node scripts/claim-projects.js --email ci-owner@example.test
          docker exec app node scripts/claim-projects.js --email ci-owner@example.test | grep "Nothing to claim"
      - run: npx playwright test -c playwright.container.config.ts
        env: { CONTAINER_PHASE: verify-upgrade }
      - name: Replace the container again (same volume); secret must not change
        run: |
          before=$(sha256sum "$DATA/secrets/auth-secret" | cut -c1-64)
          docker rm -f app
          docker run -d --name app -p 1337:1337 -v "$DATA:/app/data" -e PUID=$(id -u) -e PGID=$(id -g) -e APP_URL=http://127.0.0.1:1337 -e EVENT_SYNC_HOURS=0 -e INSTAGRAM_MONITOR_ENABLED=false cosplay-planner:ci
          "$RUNNER_TEMP/wait.sh"
          after=$(sha256sum "$DATA/secrets/auth-secret" | cut -c1-64)
          test "$before" = "$after" && echo "auth secret unchanged"
          ls "$DATA/backups"
      - run: npx playwright test -c playwright.container.config.ts
        env: { CONTAINER_PHASE: verify-replaced }
      - name: Admin password reset works
        run: docker exec app node scripts/reset-password.js --email ci-owner@example.test | grep "Password reset for"
      - name: Admin role command works
        run: docker exec app node scripts/set-admin.js --email ci-owner@example.test | grep "now an admin"
      - name: Container logs
        if: always()
        run: docker logs app || true

  image:
    needs: [test, container]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.HAS_DOCKERHUB_TOKEN == 'true' && format('docker.io/{0}/{1}', env.DOCKERHUB_USER, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          printf '\n---\nDocker image: `ghcr.io/%s/%s:%s`\n' "${{ github.repository_owner }}" "${{ env.IMAGE_NAME }}" "$v" >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
